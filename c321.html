<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C321 捷運模擬器 Pro - LED Red Edition</title>
    <style>
        :root {
            --door-color: #bdc3c7;
            --led-bg: #050505;
            --led-red: #ff0000; /* 修改為純紅字 */
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 模擬 LED 顯示器 */
        .led-display {
            width: 500px;
            height: 50px;
            background-color: var(--led-bg);
            border: 6px solid #222;
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            /* 模擬點陣屏的微弱網格背景 */
            background-image: radial-gradient(#111 1px, transparent 0);
            background-size: 3px 3px;
        }

        .led-text {
            white-space: nowrap;
            position: absolute;
            color: var(--led-red);
            /* 優先使用寬度一致的等寬點陣感字體 */
            font-family: 'MS Gothic', 'Courier New', 'DotGothic16', monospace;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px; /* 增加字距模擬點陣感 */
            animation: marquee 20s linear infinite;
            /* 紅光發散效果 */
            text-shadow: 2px 0 8px rgba(255, 0, 0, 0.8), -2px 0 8px rgba(255, 0, 0, 0.8);
        }

        @keyframes marquee {
            0% { transform: translateX(500px); }
            100% { transform: translateX(-100%); }
        }

        /* 車門區域 */
        .train-frame {
            width: 450px;
            height: 350px;
            background-color: #7f8c8d;
            border: 12px solid #95a5a6;
            position: relative;
            overflow: hidden;
            display: flex;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .door {
            width: 50%;
            height: 100%;
            background-color: var(--door-color);
            border: 2px solid #7f8c8d;
            position: absolute;
            transition: transform 2.2s cubic-bezier(0.45, 0, 0.55, 1); /* 調整為更像氣動門的平滑感 */
            z-index: 2;
        }

        /* 門縫線條 */
        .door::before {
            content: "";
            position: absolute;
            top: 0;
            width: 4px;
            height: 100%;
            background-color: #333;
        }
        .left-door::before { right: 0; }
        .right-door::before { left: 0; }

        .door::after { /* 窗戶 */
            content: "";
            position: absolute;
            top: 15%;
            left: 20%;
            width: 60%;
            height: 45%;
            background-color: #1c2833;
            border: 3px solid #555;
            border-radius: 4px;
        }

        .left-door { left: 0; }
        .right-door { right: 0; }

        .open .left-door { transform: translateX(-95%); }
        .open .right-door { transform: translateX(95%); }

        .interior {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #bdc3c7;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #7f8c8d;
            font-weight: bold;
        }

        /* 控制面板 */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px #999;
            active: transform translateY(4px);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px #666;
        }

        .btn-open { background-color: #27ae60; }
        .btn-bell { background-color: #f1c40f; color: black; }
        .btn-close { background-color: #c0392b; }

        #player-container { display: none; }
    </style>
</head>
<body>

    <!-- LED 紅字跑馬燈 -->
    <div class="led-display">
        <div class="led-text">
            你好，為維護車廂乘客的權益，請勿在車廂內飲食、吸煙、嚼食口香糖或檳榔，謝謝。 
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            To maintain the rights of passengers, smoking, eating, drinking, or chewing gum or betel nut is not allowed in the train. Thank you.
        </div>
    </div>

    <!-- 車門主體 -->
    <div class="train-frame" id="door-frame">
        <div class="interior">往 淡水 Tamsui</div>
        <div class="door left-door"></div>
        <div class="door right-door"></div>
    </div>

    <!-- 控制鈕 -->
    <div class="controls">
        <button class="btn-open" onclick="handleOpen()">開門 OPEN</button>
        <button class="btn-bell" onclick="handleBell()">發車鈴 CHIME</button>
        <button class="btn-close" onclick="handleClose()">關門 CLOSE</button>
    </div>

    <div id="player-container">
        <div id="player-open"></div>
        <div id="player-bell"></div>
        <div id="player-close"></div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var playerOpen, playerBell, playerClose;
        const doorFrame = document.getElementById('door-frame');

        function onYouTubeIframeAPIReady() {
            playerOpen = new YT.Player('player-open', { videoId: '7GyaYHlSPtA', height: '0', width: '0' });
            playerBell = new YT.Player('player-bell', { videoId: '24qlKW-0iD8', height: '0', width: '0' });
            playerClose = new YT.Player('player-close', { videoId: 'pMBrdICaAMQ', height: '0', width: '0' });
        }

        function handleOpen() {
            stopSounds();
            doorFrame.classList.add('open');
            playerOpen.seekTo(0);
            playerOpen.playVideo();
        }

        function handleBell() {
            stopSounds();
            playerBell.seekTo(0);
            playerBell.playVideo();
        }

        function handleClose() {
            playerBell.stopVideo();
            doorFrame.classList.remove('open');
            playerClose.seekTo(0);
            playerClose.playVideo();
        }

        function stopSounds() {
            playerOpen.stopVideo();
            playerBell.stopVideo();
            playerClose.stopVideo();
        }
    </script>
</body>
</html>
