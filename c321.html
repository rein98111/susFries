<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C321 捷運模擬器 - 最終優化版</title>
    <style>
        :root {
            --door-color: #bdc3c7;
            --led-bg: #050505;
            --led-red: #ff0000;
        }

        * { box-sizing: border-box; touch-action: manipulation; }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }

        /* LED 顯示器 */
        .led-display {
            width: 90%;
            max-width: 500px;
            height: 50px;
            background-color: var(--led-bg);
            border: 4px solid #333;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            background-image: radial-gradient(#222 1px, transparent 0);
            background-size: 3px 3px;
        }

        .led-text {
            white-space: nowrap;
            position: absolute;
            color: var(--led-red);
            font-family: 'MS Gothic', monospace;
            font-size: 22px;
            font-weight: bold;
            animation: marquee 20s linear infinite;
            text-shadow: 0 0 8px red;
        }

        @keyframes marquee {
            0% { transform: translateX(500px); }
            100% { transform: translateX(-100%); }
        }

        /* 車門框架 */
        .train-frame {
            width: 90%;
            max-width: 450px;
            aspect-ratio: 4 / 3;
            background-color: #7f8c8d;
            border: 10px solid #95a5a6;
            position: relative;
            overflow: hidden;
            display: flex;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .door {
            width: 50%;
            height: 100%;
            background-color: var(--door-color);
            border: 1px solid #95a5a6;
            position: absolute;
            z-index: 2;
            transition: transform 0.1s linear; /* 基礎過渡，主要由 JS 動畫控制 */
        }

        .door::before {
            content: "";
            position: absolute;
            top: 0;
            width: 6px;
            height: 100%;
            background-color: #111;
        }

        .left-door { left: 0; transform: translateX(0); }
        .left-door::before { right: 0; }
        .right-door { right: 0; transform: translateX(0); }
        .right-door::before { left: 0; }

        .window {
            width: 70%;
            height: 45%;
            background-color: #1a252f;
            border: 3px solid #555;
            border-radius: 5px;
            margin: 20% auto;
        }

        .interior {
            position: absolute; width: 100%; height: 100%;
            background: #bdc3c7; z-index: 1;
            display: flex; justify-content: center; align-items: center;
            color: #7f8c8d; font-weight: bold; font-size: 1.2rem;
        }

        /* 控制面板 */
        .controls {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 450px;
        }

        button {
            padding: 15px 5px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px #000;
        }

        button:active { transform: translateY(2px); box-shadow: 0 2px #000; }
        .btn-open { background-color: #27ae60; }
        .btn-bell { background-color: #f1c40f; color: black; }
        .btn-close { background-color: #c0392b; }

        /* 動畫類別定義 */
        .anim-open { transition: transform 3.5s cubic-bezier(0.4, 0, 0.2, 1) !important; }
        .anim-close-phase1 { transition: transform 2.5s ease-in !important; }
        .anim-close-phase2 { transition: transform 0.8s linear !important; } /* 停頓點 */
        .anim-close-phase3 { transition: transform 1.2s ease-out !important; }

        #player-container { display: none; }
    </style>
</head>
<body>

    <div class="led-display">
        <div class="led-text">
            你好，為維護車廂乘客的權益，請勿在車廂內飲食、吸煙、嚼食口香糖或檳榔，謝謝。 
            &nbsp;&nbsp;&nbsp;&nbsp;
            To maintain the rights of passengers, smoking, eating, drinking, or chewing gum or betel nut is not allowed in the train. Thank you.
        </div>
    </div>

    <div class="train-frame">
        <div class="interior">往 淡水 Tamsui</div>
        <div id="l-door" class="door left-door"><div class="window"></div></div>
        <div id="r-door" class="door right-door"><div class="window"></div></div>
    </div>

    <div class="controls">
        <button class="btn-open" onclick="handleOpen()">開門 OPEN</button>
        <button class="btn-bell" onclick="handleBell()">發車鈴 CHIME</button>
        <button class="btn-close" onclick="handleClose()">關門 CLOSE</button>
    </div>

    <div id="player-container"><div id="player-open"></div><div id="player-bell"></div><div id="player-close"></div></div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var playerOpen, playerBell, playerClose;
        const lDoor = document.getElementById('l-door');
        const rDoor = document.getElementById('r-door');

        function onYouTubeIframeAPIReady() {
            playerOpen = new YT.Player('player-open', { videoId: '7GyaYHlSPtA', height: '0', width: '0' });
            playerBell = new YT.Player('player-bell', { videoId: '24qlKW-0iD8', height: '0', width: '0' });
            playerClose = new YT.Player('player-close', { videoId: 'pMBrdICaAMQ', height: '0', width: '0' });
        }

        function clearAnimClasses() {
            lDoor.className = 'door left-door';
            rDoor.className = 'door right-door';
        }

        function handleOpen() {
            stopSounds();
            playerOpen.seekTo(0);
            playerOpen.playVideo();

            setTimeout(() => {
                clearAnimClasses();
                lDoor.classList.add('anim-open');
                rDoor.classList.add('anim-open');
                lDoor.style.transform = 'translateX(-95%)';
                rDoor.style.transform = 'translateX(95%)';
            }, 1000);
        }

        function handleBell() {
            stopSounds();
            playerBell.seekTo(0);
            playerBell.playVideo();
        }

        function handleClose() {
            playerBell.stopVideo();
            playerClose.seekTo(0);
            playerClose.playVideo();

            setTimeout(() => {
                // 第一階段：快關
                clearAnimClasses();
                lDoor.classList.add('anim-close-phase1');
                rDoor.classList.add('anim-close-phase1');
                lDoor.style.transform = 'translateX(-8%)';
                rDoor.style.transform = 'translateX(8%)';

                // 第二階段：瞬間停住 (2.5秒後執行)
                setTimeout(() => {
                    clearAnimClasses();
                    lDoor.classList.add('anim-close-phase2');
                    rDoor.classList.add('anim-close-phase2');
                    // 保持原位
                    setTimeout(() => {
                        // 第三階段：緩慢合攏 (0.8秒後執行)
                        clearAnimClasses();
                        lDoor.classList.add('anim-close-phase3');
                        rDoor.classList.add('anim-close-phase3');
                        lDoor.style.transform = 'translateX(0)';
                        rDoor.style.transform = 'translateX(0)';
                    }, 800);
                }, 2500);
            }, 1000);
        }

        function stopSounds() {
            playerOpen.stopVideo();
            playerBell.stopVideo();
            playerClose.stopVideo();
        }
    </script>
</body>
</html>
