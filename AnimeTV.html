<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模擬電視台 Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }
        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: calc(100% - 40px);
            border: none;
        }
        
        /* 1% 黑色實體遮罩 */
        #tv-glass-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 40px);
            z-index: 15; 
            background: rgba(0, 0, 0, 0.01);
            cursor: none;
        }

        /* 左上角播放資訊 */
        #ui-overlay {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 20; 
            color: #fff;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: bold;
            pointer-events: none;
            transition: opacity 0.5s ease;
            letter-spacing: 1px;
            border-left: 4px solid #ff3333;
        }

        /* 畫面中央的「點擊開啟聲音」提示蓋板 */
        #mute-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 40px);
            background: rgba(0, 0, 0, 0.6);
            z-index: 25; 
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        .mute-hint-box {
            background: #ff3355;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite;
        }

        /* 底部跑馬燈 */
        #marquee-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: rgba(20, 20, 20, 0.95);
            border-top: 2px solid #ff3333;
            overflow: hidden;
            display: flex;
            align-items: center;
            z-index: 20;
        }
        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 25s linear infinite;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .marquee-content span {
            color: #ffcc00; 
            margin: 0 10px;
        }

        /* 全螢幕按鈕 */
        .btn-fullscreen {
            position: absolute;
            bottom: 60px;
            right: 20px;
            z-index: 20;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid #fff;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-fullscreen:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="player"></div>
        <div id="tv-glass-overlay"></div>
        
        <div id="ui-overlay">
            <span id="video-title">載入中...</span>
        </div>

        <div id="mute-overlay" onclick="unmuteTV()">
            <div class="mute-hint-box">📺 點擊畫面開啟電視聲音與全螢幕</div>
        </div>

        <div id="marquee-container">
            <div id="marquee-text" class="marquee-content">歡迎收看個人自訂電視台...</div>
        </div>

        <button class="btn-fullscreen" onclick="toggleFullScreen()">切換全螢幕</button>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const customMarqueeText = "歡迎收看專屬動漫頻道！ <span>【今日強檔】</span> 我們這一家、我家隔壁的魚乾妹 連續馬拉松播放中！ <span>【廣告招租】</span> 歡迎各大廠商洽詢工商。 本網頁支援記憶續播功能，下次開啟自動播放下一集！";

        const programList = [
            { id: 'ombIrb-S8BA', title: '我們這一家' },
            { id: 'jcHJ-gI6QA8', title: '我們這一家' },
            { id: 'Uj_zlIr3sGM', title: '我家有個魚乾妹' },
            { id: 'IDclXJgqaqw', title: '我家有個魚乾妹' },
            { id: 'mfe2DUbarXM', title: '我家有個魚乾妹' },
            { id: 'opc7PdVqaqg', title: '我家有個魚乾妹' },
            { id: 'rCwGxXscJT0', title: '我家有個魚乾妹' },
            { id: 'WDUlPpM55hc', title: '我家有個魚乾妹' },
            { id: 'sBvxWZjyW2M', title: '新我們這一家' },
            { id: '3Ywp5U-H_A8', title: '新我們這一家' },
            { id: 'Po4nOBbTyQU', title: '我家有個魚乾妹' },
            { id: '3LfGA29BTdY', title: '我家有個魚乾妹' },
            { id: 'LC_BTd5NFiE', title: '我家有個魚乾妹' },
            { id: 'ev-4zvnjSqw', title: '我家有個魚乾妹' },
            { id: '6Wo9lJu-PtM', title: '我家有個魚乾妹' },
            { id: '80c4wBJwbN4', title: '我家有個魚乾妹' },
            { id: 'YOi2TP1rY30', title: '我們這一家' },
            { id: 'Gp_wDSfyDJw', title: '我們這一家' }
        ];

        const adList = [
            { id: 'R435z0xeEHo', title: 'NTE' },
            { id: 'QavLBFVBQeE', title: 'Estella' },
            { id: 'Z-dKaljWczc', title: '才女のお世話' },
            { id: 'IV70efSGbPc', title: '緞帶英雄' },
            { id: 'xlYkUeVnsd0', title: 'NTE' },
            { id: 'N2LdhOe7onQ', title: '保莉達び魔力補給飲料' },
            { id: 'orJGumjCC7o', title: 'NTE' },
            { id: 'TJXSiIESLyc', title: '絕區零' },
            { id: 'Lmy9TdnkIJo', title: '鳴潮' },
            { id: '2dMctUEBHY4', title: '崩壞：星穹鐵道' },
            { id: 'XuQSD1hrNhg', title: '崩壞：星穹鐵道' },
            { id: 'LkxwwIyXJxE', title: '崩壞：星穹鐵道' },
            { id: 'AyQQZ37OPfU', title: '維他露P+' }
        ];

        let player;
        let currentProgramIndex = 0;
        let isPlayingAd = false; 
        let uiTimeout; 

        // 初始化：讀取進度（此處邏輯不變，單純負責載入上次進度）
        function initProgress() {
            document.getElementById('marquee-text').innerHTML = customMarqueeText;

            const savedIndex = localStorage.getItem('tv_program_index');
            if (savedIndex !== null) {
                currentProgramIndex = parseInt(savedIndex) % programList.length;
            } else {
                currentProgramIndex = 0;
            }
        }

        function onYouTubeIframeAPIReady() {
            initProgress();
            const currentVideo = programList[currentProgramIndex];

            player = new YT.Player('player', {
                videoId: currentVideo.id,
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 0, 
                    'rel': 0,
                    'modestbranding': 1,
                    'iv_load_policy': 3,
                    'cc_load_policy': 0,
                    'fs': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
            
            updateUI(`${currentVideo.title} (第 ${currentProgramIndex + 1}/${programList.length} 集)`);
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function unmuteTV() {
            if (player && typeof player.unMute === 'function') {
                player.unMute();     
                player.setVolume(50); 
                
                const overlay = document.getElementById('mute-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 500);

                enterFullScreen();
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                playNext();
            }
        }

        // 【核心時序修正】
        function playNext() {
            if (!isPlayingAd) {
                // 1. 正片播完了 -> 「立刻」把正片指針推向下一 wholesome 集並儲存
                isPlayingAd = true;
                
                // 先算出下一集是誰
                currentProgramIndex++;
                if (currentProgramIndex >= programList.length) {
                    currentProgramIndex = 0; // 播完最後一集回到第一集
                }
                // 立刻儲存最新排班進度，這樣就算播廣告時斷電、刷新，下次進來也是播新的一集
                localStorage.setItem('tv_program_index', currentProgramIndex);

                // 接著抽隨機廣告播放
                const randomIndex = Math.floor(Math.random() * adList.length);
                const currentAd = adList[randomIndex];
                
                player.loadVideoById(currentAd.id);
                updateUI(`${currentAd.title} (隨機廣告破口)`);
                
            } else {
                // 2. 廣告播完了 -> 直接切換到剛剛已經排班好的 currentProgramIndex 正片
                isPlayingAd = false;
                const currentVideo = programList[currentProgramIndex];
                
                player.loadVideoById(currentVideo.id);
                updateUI(`${currentVideo.title} (第 ${currentProgramIndex + 1}/${programList.length} 集)`);
            }
        }

        function updateUI(displayText) {
            const titleEl = document.getElementById('video-title');
            const overlay = document.getElementById('ui-overlay');

            titleEl.innerText = `現在播放：${displayText}`;

            clearTimeout(uiTimeout);
            overlay.style.opacity = "1";

            uiTimeout = setTimeout(() => {
                overlay.style.opacity = "0"; 
            }, 5000);
        }

        function enterFullScreen() {
            const docEl = window.document.documentElement;
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFullScreen) {
                requestFullScreen.call(docEl);
            }
        }

        function toggleFullScreen() {
            const doc = window.document;
            const docEl = doc.documentElement;
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                requestFullScreen.call(docEl);
            } else {
                cancelFullScreen.call(doc);
            }
        }
    </script>
</body>
</html>
